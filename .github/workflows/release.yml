# Builds the .vsix from the tagged commit, publishes it as a release asset, and pushes it to
# Open VSX so installed copies auto-update.
#
# The point is that the downloadable artifact can never drift from the source: it is built here, from
# the tag, rather than uploaded by hand from someone's laptop. Push a tag, get a release.
#
#     npm version 1.0.1 --no-git-tag-version   # or edit package.json
#     git commit -am "release: v1.0.1" && git push
#     git tag v1.0.1 && git push origin v1.0.1
#
# A tag with a prerelease suffix — v1.0.1-rc1 — runs everything and publishes a
# release marked prerelease. Use it to prove a change to this file before a real
# tag depends on it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # needed to create the release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Not 20: it left maintenance in April 2026, and building the published
          # artifact on an end-of-life runtime is not a thing to discover later.
          # This is the build runtime only — the extension still supports Node 18+.
          node-version: '22'

      # No `npm ci`: this extension has zero dependencies and ships no lockfile.

      # A tag that disagrees with the manifest produces an asset whose filename lies about what is
      # inside it. Fail here rather than publish it.
      - name: Tag must match package.json version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # A prerelease suffix is allowed and compared on the base version, so
          # v1.0.4-rc1 can exercise this whole workflow — action major bumps
          # included — without touching the real v1.0.4 release.
          BASE="${TAG%%-*}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$BASE" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "releasing v$PKG"

      # Runs the redistribution guards (no token, machine path or ClickUp id in any shipped file) and
      # the config-drift guard (every env key the dispatcher reads is documented). These are exactly
      # the checks that must not be skipped on a publish.
      #
      # The dispatcher's own `node src/agent-loop.mjs --selftest` is deliberately NOT run here: it
      # spawns real processes and exercises OS-specific process-tree kills, and has only been
      # verified on Windows. Run it locally before tagging.
      - name: Selftest
        run: npm run selftest

      - name: Package
        run: npx --yes @vscode/vsce package --allow-missing-repository

      # Published in the release body so anyone can verify the download.
      - name: Checksum
        run: sha256sum *.vsix | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.vsix
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Install: download the `.vsix` below, then

            ```
            code --install-extension agent-loop-${{ steps.version.outputs.version }}.vsix
            ```

            or in VS Code: Extensions → `…` → *Install from VSIX…*

            A hand-installed `.vsix` does not auto-update. Installing from your editor's
            marketplace does — `code --install-extension SergeyOhanyan.agent-loop`, or
            `cursor --install-extension SergeyOhanyan.agent-loop` for Cursor/VSCodium/Windsurf.

            Verify the download against `SHA256SUMS.txt`.

      # Registry publishing. An editor only auto-updates extensions it installed from a registry, so
      # a release that stops at the GitHub asset reaches nobody who is already running Agent Loop —
      # v1.0.7 shipped to GitHub, never to a registry, and landed in no editor. Automating it here is
      # the same rule the .vsix already follows: built from the tag, so it cannot drift.
      #
      # Runs AFTER the release above on purpose. If a token has expired, the release and its asset
      # are already published and this step fails loudly — the reverse order would lose both.
      #
      # Prerelease tags are excluded: a -rc tag exercises everything above this line without being
      # pushed to real users as an update.
      #
      # Open VSX only, for now. The VS Code Marketplace needs an Azure DevOps *global* PAT, which
      # Microsoft fully retires on 2026-12-01, so it is published by hand from
      # https://marketplace.visualstudio.com/manage. Before December, move it here using Entra ID
      # with GitHub OIDC — `vsce publish --azure-credential` — which needs no stored secret.
      - name: Publish to Open VSX
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          # A missing secret expands to an empty string and fails several steps later as an opaque
          # auth error. Say what is actually wrong instead.
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is not set — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          npx --yes ovsx publish "agent-loop-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT"
